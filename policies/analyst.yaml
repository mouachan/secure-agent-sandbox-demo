version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  maas_inference:
    name: maas-inference
    endpoints:
      - host: <maas-hostname>
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
        tls: terminate
    binaries:
      - { path: "/sandbox/.uv/python/**" }
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }
